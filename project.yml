name: Anilite
options:
  bundleIdPrefix: app.anilite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Injected by CI from the ANILIST_CLIENT_ID secret; empty means "public profile / local mode only".
    ANILIST_CLIENT_ID: ""

packages:
  AniliteKit:
    path: Packages/AniliteKit

targets:
  Anilite:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: AniliteKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Anilite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        AniListClientID: $(ANILIST_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: app.anilite.ios
            CFBundleURLSchemes:
              - anilite
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.anilite.ios.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.anilite.ios
        PRODUCT_NAME: Anilite
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MTL_FAST_MATH: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          MTL_ENABLE_DEBUG_INFO: NO

  AniliteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: Anilite
      - package: AniliteKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.anilite.ios.tests
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Anilite:
    build:
      targets:
        Anilite: all
        AniliteTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AniliteTests
    run:
      config: Debug
    archive:
      config: Release
